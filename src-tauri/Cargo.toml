[package]
name = "mikui"
version = "0.1.0"
description = "Kafka Messages Viewer"
authors = ["nahua"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "mikui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order — ради показа тел Avro.
#
# apache-avro печатает разобранную запись через `serde_json::Map`, а тот без
# этой фичи — `BTreeMap`, то есть поля уехали бы по алфавиту. Человек сверяет
# сообщение со своим .avsc сверху вниз, поэтому порядок обязан быть порядком
# объявления — тем же, которым печатает заготовки `template`. На остальной
# конфигурации фича сказывается только тем, что ключи в JSON на диске идут в
# порядке появления, а не по алфавиту.
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-dialog = "2"
# Ссылки на сообщение (`mikui://message/v1?…`): регистрация схемы в системе и
# доставка ссылки уже запущенному приложению.
tauri-plugin-deep-link = "2"
# Разбор и сборка тех же ссылок.
#
# Крейт уже в графе зависимостей — его тянет сама tauri, — поэтому прямая
# зависимость не добавляет к сборке ничего. Своего разбора здесь быть не должно
# принципиально: единственное место, где ссылка может разъехаться с собой, —
# это два способа её прочитать.
url = "2"
# SIMD-поиск подстроки по сырым байтам: фильтрация идёт до UTF-8 декода
# и без аллокаций на сообщение.
memchr = "2"
# oneshot-каналы для ответов Kafka-воркера. Tauri-команда ждёт ответ через
# .await, не занимая поток исполнителя.
#
# `rt` — ради одного места: rdkafka отдаёт результат `DescribeConfigs` будущим,
# а воркер живёт на обычном потоке и ждёт его синхронно (см. `topic_config`).
# Однопоточного рантайма для этого достаточно: будущее будит собственный поток
# админского клиента, ни таймеров, ни ввода-вывода ему не нужно.
tokio = { version = "1", features = ["sync", "rt"] }
keyring = { version = "4.1.6", features = ["apple-native-keyring-store"] }
chrono = { version = "0.4.45", features = ["clock"] }

# Случайные UUID для заготовок protobuf (см. `schema::proto::template`).
#
# Фича одна — `v4`, генератор случайных: разбирать и печатать чужие UUID нам
# незачем, мы их только выдумываем. В графе зависимостей крейт уже был (его
# тянет tauri), так что своих сборочных издержек эта строка не добавляет.
uuid = { version = "1", features = ["v4"] }

# Protobuf-схемы топиков.
#
# protobuf-parse разбирает .proto ЧИСТЫМ РУСТОМ (`Parser::pure`) — внешний
# protoc на машине пользователя не нужен, а он бы и не был там гарантирован.
# protobuf даёт reflection: descriptor-граф и разбор тела по нему без кодогенерации.
# protobuf-json-mapping печатает разобранное сообщение в канонический JSON —
# тем самым и таблица, и модалка переиспользуют уже готовый JSON-путь фронта.
protobuf = "3.7"
protobuf-parse = "3.7"
protobuf-json-mapping = "3.7"

# Avro-схемы топиков.
#
# Официальный крейт Apache. Работает по РАЗОБРАННОЙ СХЕМЕ, без кодогенерации —
# то есть ровно в том режиме, в каком у нас уже живёт protobuf. Даёт всё, что
# нужно, одним крейтом: `Schema::parse_list` связывает несколько .avsc со
# ссылками друг на друга, `from_avro_datum_schemata` разбирает тело,
# `TryFrom<Value> for serde_json::Value` печатает его в JSON, а
# `Value::resolve` + `to_avro_datum_schemata` кодируют обратно и сами
# объясняют, чем введённое не легло на схему.
#
# Фичи не включены ни одной: bzip/snappy/xz/zstandard — это кодеки контейнерных
# файлов (OCF), а в топиках лежат одиночные datum. Null и deflate крейт умеет
# и без них.
apache-avro = "0.22"

# Валидация тела по JSON Schema — третьему и последнему формату Confluent
# Schema Registry.
#
# Только для ОТПРАВКИ: при чтении схема не нужна вовсе, за заголовком лежит
# обычный JSON. Зато при отправке она единственное, что отличает «положили в
# топик валидное сообщение» от «положили текст, который потребитель не
# прочитает», — и объясняет, чем именно введённое не легло на контракт.
#
# default-features = false — принципиально. По умолчанию крейт включает
# `resolve-http` и тянет reqwest, то есть ровно тот полноценный асинхронный
# стек, от которого мы отказались этажом ниже в пользу ureq. Заодно это
# закрывает разрешение `$ref` по сети: схема из реестра не должна заставлять
# приложение ходить по произвольным URL, а ссылки внутри реестра приезжают
# полем `references`, а не HTTP-ссылкой.
jsonschema = { version = "0.53", default-features = false }

# HTTP к Schema Registry.
#
# Не reqwest: tokio у нас подключён с фичами `sync` и `rt` (см. выше), без
# ввода-вывода вовсе, и тянуть полноценный сетевой рантайм ради десятка GET
# было бы несоразмерно. ureq блокирующий, и это здесь удобно: из Tauri-команд
# он уходит в `spawn_blocking`, а из Kafka-воркера зовётся напрямую — тот и так
# живёт на выделенном потоке.
#
# platform-verifier — доверять системному хранилищу корней. Корпоративный
# TLS-инспектор подписывает свой сертификат внутренним CA, которого нет в
# webpki-roots; в системное хранилище его ставят централизованно. Свой
# PEM-бандл поверх этого задаётся в настройках подключения.
ureq = { version = "3", features = ["platform-verifier"] }

# librdkafka.
#
# ssl-vendored — OpenSSL собирается из исходников вместо системного: на Windows
#   системного просто нет, и сборка падала бы на openssl-sys.
# libz + zstd — топики часто сжаты; без этих фич consume по такому топику
#   отваливается. lz4 и snappy librdkafka несёт в себе.
# default-features = false — снимает фичу `tokio`: мы работаем через BaseConsumer
#   на выделенном потоке, futures-обёртки rdkafka не нужны.
#
# Фича `sasl` НЕ включена намеренно. В rdkafka-sys `sasl = ["gssapi"]`, а
# `gssapi = ["ssl", "sasl2-sys"]`, то есть она тянет Cyrus SASL, который не
# собирается под Windows. SCRAM-SHA-256/512, PLAIN и OAUTHBEARER librdkafka
# умеет сама поверх OpenSSL, без Cyrus. Kerberos — через фичу `gssapi` ниже.
[target.'cfg(not(windows))'.dependencies]
rdkafka = { version = "0.36", default-features = false, features = ["libz", "zstd", "ssl-vendored"] }

# Под Windows librdkafka собирается только через CMake: дефолтный build.rs
# запускает ./configure (POSIX-скрипт), под MSVC это не работает.
# Требует установленный cmake на машине сборки.
[target.'cfg(windows)'.dependencies]
rdkafka = { version = "0.36", default-features = false, features = ["libz", "zstd", "ssl-vendored", "cmake-build"] }

# Один экземпляр приложения на систему — только там, где это нужно ссылкам.
#
# macOS доставляет `mikui://…` уже запущенному приложению сама (Apple Events),
# а Windows и Linux просто запускают ещё одну копию с URL в аргументах. Вторая
# копия — это второй Kafka-воркер и второе окно поверх первого; фича «открой
# сообщение» превратилась бы в «открой ещё один mikui».
#
# Фича `deep-link` у плагина передаёт перехваченный URL плагину ссылок первого
# экземпляра, то есть ровно в тот же обработчик, что и на macOS.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[features]
default = []
# Kerberos/GSSAPI. Тянет Cyrus SASL (sasl2-sys) — только Linux-сборка.
gssapi = ["rdkafka/gssapi-vendored"]
